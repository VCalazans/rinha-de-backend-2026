worker_processes 1;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

stream {
    upstream api {
        least_conn;
        server unix:/sockets/api1.sock;
        server unix:/sockets/api2.sock;
    }

    server {
        listen 9999 reuseport;
        proxy_pass api;
    }
}
