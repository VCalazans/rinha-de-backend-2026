services:
  api1:
    image: ghcr.io/vcalazans/rinha-api:latest
    container_name: rinha-api-1
    security_opt:
      - seccomp=unconfined
    environment:
      - MODE=api_uring
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=1
    ports:
      - "9999:9999"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/vcalazans/rinha-api:latest
    container_name: rinha-api-2
    security_opt:
      - seccomp=unconfined
    environment:
      - MODE=api_uring
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=1
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

  lb:
    image: nginx:alpine
    container_name: rinha-lb
    network_mode: "service:api1"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"

networks:
  rinha:
    driver: bridge
