volumes:
  sockets:

services:
  lb:
    image: haproxy:alpine
    container_name: rinha-lb
    volumes:
      - sockets:/sockets
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"
    networks:
      - rinha

  api1:
    image: ghcr.io/vcalazans/rinha-api:latest
    container_name: rinha-api-1
    user: root
    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=1
      - UDS_PATH=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/vcalazans/rinha-api:latest
    container_name: rinha-api-2
    user: root
    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=1
      - UDS_PATH=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
