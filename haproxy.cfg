global
    maxconn 4096

defaults
    mode http
    timeout connect 2s
    timeout client 2s
    timeout server 2s
    option http-keep-alive
    http-reuse always

frontend http_front
    bind :9999
    default_backend api_back

backend api_back
    balance roundrobin
    server api1 api1:8080
    server api2 api2:8080
