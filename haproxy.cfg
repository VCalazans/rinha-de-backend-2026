global
    maxconn 4096
    nbthread 1

defaults
    mode http
    no log
    option dontlognull
    option http-keep-alive
    retries 1
    timeout connect 500ms
    timeout client 2s
    timeout server 2s
    timeout http-request 2s

frontend main
    bind *:9999
    default_backend api

backend api
    balance roundrobin
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
